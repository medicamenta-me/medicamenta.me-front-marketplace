<header class="app-header">
  <div class="container">
    <!-- Logo -->
    <button class="logo" (click)="router.navigate(['/'])" type="button" aria-label="Ir para página inicial">
      <img src="assets/logo.svg" alt="MedicaMenta.me" />
    </button>

    <!-- Search -->
    <div class="search-bar">
      <input
        type="text"
        placeholder="Buscar medicamentos..."
        [(ngModel)]="searchQuery"
        (keyup.enter)="onSearch()"
      />
      <button class="btn-search" (click)="onSearch()">
        <span class="icon-search">🔍</span>
      </button>
    </div>

    <!-- Actions -->
    <div class="actions">
      <!-- Cart -->
      <button class="btn-cart" (click)="goToCart()">
        <span class="icon-cart">🛒</span>
        @if (cartItemCount() > 0) {
          <span class="cart-badge">{{ cartItemCount() }}</span>
        }
      </button>

      <!-- User Menu -->
      @if (isAuthenticated) {
        <div class="user-menu">
          <button class="btn-user">
            <span class="user-avatar">
              {{ userProfile?.displayName?.charAt(0) || '👤' }}
            </span>
            <span class="user-name">{{ userProfile?.displayName }}</span>
          </button>

          <div class="user-dropdown">
            <button (click)="goToProfile()" type="button">Meu Perfil</button>
            <button (click)="logout()" type="button">Sair</button>
          </div>
        </div>
      } @else {
        <button class="btn-login" (click)="goToLogin()">
          Entrar
        </button>
      }
    </div>
  </div>
</header>
